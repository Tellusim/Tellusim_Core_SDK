plugins {
	id "com.android.application" version "8.3.1" apply true
}
android {
	namespace "com.tellusim.tsGraphicDecoderJPEG"
	compileSdk 33
	defaultConfig {
		applicationId "com.tellusim.tsGraphicDecoderJPEG"
		minSdk 33
		targetSdk 33
		versionCode 1
		versionName "1.0"
		ndk {
			abiFilters "arm64-v8a"
		}
	}
	externalNativeBuild {
		cmake {
			path "CMakeLists.txt"
		}
	}
}
copy {
	from files([ "../main.shader", "../texture_420.jpg", "../texture_422h.jpg", "../texture_422v.jpg", "../texture_444.jpg" ])
	into "src/main/assets"
}
copy {
	from "../../../../lib/android/arm64/libTellusim_arm64d.so"
	into "src/main/jniLibs/arm64-v8a"
}
